# This File is Created by Tang Dynasty.
# 注意：ADCList / SDCList **必须**指向实际约束文件，否则：
#   * 引脚约束不加载 → 所有 IO 未约束 → BIT-8123 Bitgen is prohibited
#   * 时序约束不加载 → 时序不分析
# TD GUI 有时会把这两项清空成 {}，请勿手动改成空。
set ADCList {"../../../constrs/anlu2_pins.adc"}
set SDCList {"../../../constrs/anlu2_timing.sdc"}
set area_option -packarea
set arr_filter false
set device_name ph1_35p.db
set drHoldFix on
set end_step bitgen
set package_name PH1P35MDG324
set prj_name {Anlu2}
set run_type phy
set speed 3
set start_step read_design
set top_model_name {system_top}